version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: polisphere_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=polisphere
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polisphere_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=polisphere
      - JWT_SECRET=super-secret-key-change-in-production-polisphere-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polisphere_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
